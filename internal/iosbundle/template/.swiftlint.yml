# SwiftLint config for the generated iOS app.
#
# The Swift code under Sources/ is the mar runtime ported to iOS: an
# interpreter that walks user-supplied Mar values, environments, and
# expressions. Several of SwiftLint's defaults conflict with idioms
# common to interpreters; this file relaxes those without weakening
# the rules that catch real issues.

disabled_rules:
  # The interpreter uses one-letter names for the universal "value /
  # environment / expression / message" parameters (`v`, `e`, `m`,
  # `s`, `c`). Renaming each to `value`/`environment`/etc. would add
  # noise without clarity in tight pattern-match arms.
  - identifier_name

  # We deliberately align grouped definitions by padding commas so
  # related rows read as a column ("True" / "False", "Just" /
  # "Nothing"). The rule flags that style as a violation.
  - comma

# `master` here is the audio term: a master bus and a master level, from
# "master recording". It carries none of the master/slave sense the rule is
# looking for, and renaming it would make the mixer code read worse than it
# reads now.
inclusive_language:
  override_allowed_terms:
    - master

opt_in_rules:
  - explicit_init
  - first_where
  - last_where
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

# Interpreters and pattern dispatchers naturally produce long, branchy
# functions; raising the thresholds keeps the rule useful for genuinely
# bloated code without screaming about the eval/match core.
cyclomatic_complexity:
  warning: 50
  error: 80

# `MarBuiltins.makeEnv` defines every runtime builtin in one place
# (organized by MARK sections); `MarEval.eval` dispatches every Expr
# variant. Both are intentionally long-by-nature; splitting them just
# to placate the linter would scatter the dispatch table.
function_body_length:
  warning: 200
  error: 400

type_body_length:
  warning: 600
  error: 1000

# Measured, not guessed: the runtime's subsystem files are MarSound at 1401
# lines, MarRenderer at 1256 and AppViewModel at 859. The threshold leaves
# each of them room to breathe and still fires on one that grows materially.
# MarBuiltins is in another league at 3489 and turns the rule off for itself,
# at the top of the file, with the reason.
file_length:
  warning: 1500
  error: 1700

# A 3-member tuple is unreadable when you reach it by position. Every one of
# these carries NAMED fields -- (top:right:bottom:left) for the safe-area box,
# (mean:lo:hi) for a measured level, (aDigits:bDigits:scale) for a Decimal
# alignment -- so the use site reads the name, not the index. The one tuple
# that was positional got names instead of an exemption.
large_tuple:
  warning: 4
  error: 5

# The long lines left are interpolated strings: key formats that have to read
# as one key, and user-facing error wording that the failure-copy tests compare
# verbatim. Breaking either across lines makes it harder to read and harder to
# grep for than the length costs.
line_length:
  warning: 140
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
